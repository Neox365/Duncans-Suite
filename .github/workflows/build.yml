name: Windows-Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC-Umgebung einrichten
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Konfigurieren (MSVC, x64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Alle Programme bauen (Release)
        run: cmake --build build

      - name: Test der Metadaten-Bereinigung auf Byte-Ebene
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 photo\tests\ByteStripTest.cpp /Fe:build\ByteStripTest.exe /Fo:build\ByteStripTest.obj
          build\ByteStripTest.exe

      - name: EXE-Dateien als Artefakt ablegen (unsigniert)
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.exe
