name: Windows-Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC-Umgebung einrichten
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Konfigurieren (MSVC, x64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Alle Programme bauen (Release)
        run: cmake --build build

      - name: Test der Metadaten-Bereinigung auf Byte-Ebene
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 photo\tests\ByteStripTest.cpp /Fe:build\ByteStripTest.exe /Fo:build\ByteStripTest.obj
          build\ByteStripTest.exe

      - name: Test der Duplikatsuche und der EXIF-Zeit
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /DNOMINMAX photo\tests\DuplicatesTest.cpp photo\ImageOps.cpp /Fe:build\DuplicatesTest.exe /Fo:build\ /link windowscodecs.lib ole32.lib oleaut32.lib uuid.lib propsys.lib
          build\DuplicatesTest.exe
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /DNOMINMAX photo\tests\EditTest.cpp photo\ImageOps.cpp /Fe:build\EditTest.exe /Fo:build\ /link windowscodecs.lib ole32.lib oleaut32.lib uuid.lib propsys.lib
          build\EditTest.exe

      - name: Test von Oggys Docs-Files (Betraege, Index, Suche, PDF-Schreiber)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 docs\tests\DocsTest.cpp /Fe:build\DocsTest.exe /Fo:build\
          build\DocsTest.exe

      - name: Test von Duncan's Vault (AES-256-GCM, PBKDF2, Tresor-Datei, Generator)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 vault\tests\VaultTest.cpp /Fe:build\VaultTest.exe /Fo:build\
          build\VaultTest.exe

      - name: Test der Schnellkonvertierung im Photo Commander
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /DNOMINMAX photo\tests\ConvertTest.cpp photo\ImageOps.cpp /Fe:build\ConvertTest.exe /Fo:build\ /link windowscodecs.lib ole32.lib oleaut32.lib uuid.lib propsys.lib
          build\ConvertTest.exe

      - name: Test von Duncan's Office (Tabellen-Formeln, CSV, Textkodierung)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 office\tests\OfficeTest.cpp /Fe:build\OfficeTest.exe /Fo:build\
          build\OfficeTest.exe

      - name: Test des Aenderungsprotokoll-Parsers
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 suite\tests\ChangelogTest.cpp /Fe:build\ChangelogTest.exe /Fo:build\
          cd suite\tests && ..\..\build\ChangelogTest.exe

      - name: EXE-Dateien als Artefakt ablegen (unsigniert)
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.exe
